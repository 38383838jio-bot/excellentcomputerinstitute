<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 32px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, button {
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            width: 90%;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .back-btn {
            background: #6c757d;
            margin-top: 20px;
        }

        .results-display {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .results-display h3 {
            margin-top: 0;
            color: #495057;
        }

        .score-highlight {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Submit PowerPoint Quiz Results</h1>

        <div class="results-display" id="resultsDisplay">
            <h3>Your PowerPoint Quiz Results</h3>
            <p>Loading results...</p>
        </div>

        <form action="https://formsubmit.co/38383838jio@gmail.com" method="POST">
            <!-- Formsubmit configuration -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://yourwebsite.com/thanks.html">

            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="points">PowerPoint Points: / 50 questions</label>
                <input type="number" id="points" name="powerpoint_points out of 50 questions" placeholder="Enter points" min="0" max="50" required readonly>
            </div>

            <div class="form-group">
                <label for="course">Course:</label>
                <input type="text" id="course" name="course" value="PowerPoint course" readonly>
            </div>


            <div style="width: 40%; margin: auto;">
                <button type="submit">Submit Results</button>
            </div>
        </form>

        <button class="back-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
    </div>

    <script>
        // Auto-fill name from localStorage register data
        const nameInput = document.querySelector('input[name="name"]');
        let registerData = localStorage.getItem('registerData');
        if (registerData) {
            registerData = JSON.parse(registerData);
            nameInput.value = registerData.firstname || '';
        }

        // Get details from powerpointPoint in localStorage
        const pointsInput = document.getElementById('points');
        const resultsDisplay = document.getElementById('resultsDisplay');

        let powerpointData = localStorage.getItem('powerpointPoints');
        if (powerpointData) {
            try {
                powerpointData = JSON.parse(powerpointData);

                // Auto-fill points
                if (powerpointData.total !== undefined) {
                    pointsInput.value = powerpointData.total || 0;
                }

                // Display detailed results
                let resultsHTML = '<h3>Your PowerPoint Quiz Results</h3>';

                if (powerpointData.total !== undefined) {
                    resultsHTML += `<p class="score-highlight">Score: ${powerpointData.total}/50</p>`;
                }

                if (powerpointData.percentage !== undefined) {
                    resultsHTML += `<p>Percentage: ${powerpointData.percentage}%</p>`;
                }

                if (powerpointData.correct !== undefined && powerpointData.totalQuestions !== undefined) {
                    resultsHTML += `<p>Correct Answers: ${powerpointData.correct}/${powerpointData.totalQuestions}</p>`;
                }

                if (powerpointData.timeTaken) {
                    resultsHTML += `<p>Time Taken: ${powerpointData.timeTaken}</p>`;
                }

                if (powerpointData.dateCompleted) {
                    resultsHTML += `<p>Completed: ${new Date(powerpointData.dateCompleted).toLocaleDateString()}</p>`;
                }

                // Add any additional details from localStorage
                if (powerpointData.details) {
                    resultsHTML += `<p>Additional Info: ${powerpointData.details}</p>`;
                }

                resultsDisplay.innerHTML = resultsHTML;

            } catch (error) {
                console.error('Error parsing powerpointPoint data:', error);
                resultsDisplay.innerHTML = '<h3>Your PowerPoint Quiz Results</h3><p>Error loading results. Please check with administrator.</p>';
            }
        } else {
            resultsDisplay.innerHTML = '<h3>Your PowerPoint Quiz Results</h3><p>No results found. Please complete the quiz first.</p>';
        } 
        // Function to get total form data (similar to fowardcomputer.html)
        function getTotalFormData() {
            const formData = new FormData(document.querySelector('form'));
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            return data;
        }

        // Add form submission handler to capture total form data
        document.querySelector('form').addEventListener('submit', function(e) {
            // Get all form data before submission
            const totalFormData = getTotalFormData();
            console.log('Total Form Data:', totalFormData);

            // You can store this data or send it elsewhere if needed
            // For now, we'll let the form submit normally to FormSubmit
        });
    </script>
</body>
</html>
