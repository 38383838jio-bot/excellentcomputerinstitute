<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5</title>
</head>

<body>

<div id="q5-container" style="width:100%; background-color: rgb(138, 138, 138); color: white; margin: auto; padding: 10px; border-radius: 10px; font-size: 12px;">
    <h1>5. Windows, Linux, and macOS are examples of:</h1>

    <b>
        A. Computer languages <br>
        B. Operating systems <br>
        C. Antivirus software <br>
        D. Hardware tools
    </b>
    <br><br>

    <div style="width: 60%; margin: auto;">
        <button id="q5-answer-btn"
            style="width: 100%; background-color: rgb(4, 136, 141); padding: 10px; color: white; border: none; border-radius: 5px;">
            Insert your answer
        </button>
    </div>
</div>

<br>

<div style="text-align: center;">
    <button style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold;
        border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: .3s ease; text-transform: uppercase;"
        onclick="window.location.href='q6.html'">
        Next Question →
    </button>
</div>

<script>
    // Initialize Points (same as Q3 & Q4)
    let pointsObj = JSON.parse(localStorage.getItem("quizPoints")) || { total: 0 };

    // Answer Button (same logic)
    document.getElementById("q5-answer-btn").addEventListener("click", function () {
        const correctAnswer = "b";   // ✅ Correct answer for Q5
        const userAnswer = prompt("Insert your answer");

        if (!userAnswer) return;

        if (userAnswer.toLowerCase() === correctAnswer) {
            pointsObj.total += 1;
            localStorage.setItem("quizPoints", JSON.stringify(pointsObj)); 
        } else { 
        }

        // Update score display if it exists
        const scoreDisplay = document.getElementById("scoreDisplay");
        if (scoreDisplay) {
            scoreDisplay.innerText = "Score: " + pointsObj.total;
        }
    });
</script>

</body>
</html>
