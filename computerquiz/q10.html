<!-- ✅ QUESTION 10 -->
<div id="q10-container" style="width:95%; background-color: rgb(138, 138, 138); color: white; margin: auto; padding: 5px; border-radius: 10px; font-size: 12px;">
  <h1>10. The storage device that retains data even when power is off is:</h1>

  <b>
    A. RAM <br>
    B. ROM <br>
    C. CPU <br>
    D. UPS
  </b>
  <br><br>

  <div style="width: 60%; margin: auto;">
    <button id="q10-answer-btn"
      style="width: 100%; background-color: rgb(4, 136, 141); padding: 10px;
      color: white; border: none; border-radius: 5px;">
      Insert your answer
    </button>
  </div>
</div>

<br>

<div style="text-align: center;">
  <button style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold;
      border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: .3s ease; text-transform: uppercase;"
      onclick="window.location.href='q11.html'">
      Next Question →
  </button>
</div>

<br>

<div style="text-align: center;">
  <button
    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; border: none; padding: 15px 40px; font-size: 18px;
    font-weight: bold; border-radius: 50px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); transition: .3s ease;
    text-transform: uppercase;"
    onclick="window.location.href='../computergrade.html'">
     My Grade 
  </button>
</div>

<script>
  let pointsObj = JSON.parse(localStorage.getItem("quizPoints")) || { total: 0 };
  let answeredOnce = JSON.parse(localStorage.getItem("answeredOnce")) || {};

  const answerBtn = document.getElementById("q10-answer-btn");

  for (let i = 1; i <= 20; i++) {
    if (answeredOnce["q" + i]) {
      const btn = document.getElementById("btn" + i);
      if (btn) btn.classList.add("answered");
    }
  }

  if (answeredOnce["q10"]) {
    answerBtn.disabled = true;
    answerBtn.style.backgroundColor = "gray";
  }

  answerBtn.addEventListener("click", function () {
    if (answeredOnce["q10"]) {
      alert("You already answered this question.");
      return;
    }

    const correctAnswer = "b";
    const userAnswer = prompt("Insert your answer");

    if (!userAnswer) return;

    answeredOnce["q10"] = true;
    localStorage.setItem("answeredOnce", JSON.stringify(answeredOnce));

    if (userAnswer.toLowerCase() === correctAnswer) {
      pointsObj.total += 1;
      localStorage.setItem("quizPoints", JSON.stringify(pointsObj));
      window.location.href = "q11.html";
    }

    document.getElementById("btn10").classList.add("answered");

    this.disabled = true;
    this.style.backgroundColor = "gray";
  });
</script>
