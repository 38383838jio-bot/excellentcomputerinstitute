<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 400px;
      margin: 10px auto;
    }

    .number-box {
      width: 70px;
      height: 50px;
      background: linear-gradient(135deg, #ffffff, #d3d3d3);
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .number-box:hover {
      transform: scale(1.1);
    }

    .answered {
      background: green !important;
      color: white !important;
    }
  </style>
</head>

<body>

<!-- ✅ ANSWER TABLE -->
      <div style="text-align: center; color: green;">
        <h3>
    list of question and answered ones 

        </h3>
       </div>
<div class="flex-container">
  <div class="number-box" id="btn1">1</div>
  <div class="number-box" id="btn2">2</div>
  <div class="number-box" id="btn3">3</div>
  <div class="number-box" id="btn4">4</div>
  <div class="number-box" id="btn5">5</div>
  <div class="number-box" id="btn6">6</div>
  <div class="number-box" id="btn7">7</div>
  <div class="number-box" id="btn8">8</div>
  <div class="number-box" id="btn9">9</div>
  <div class="number-box" id="btn10">10</div>
  <div class="number-box" id="btn11">11</div>
  <div class="number-box" id="btn12">12</div>
  <div class="number-box" id="btn13">13</div>
  <div class="number-box" id="btn14">14</div>
  <div class="number-box" id="btn15">15</div>
  <div class="number-box" id="btn16">16</div>
  <div class="number-box" id="btn17">17</div>
  <div class="number-box" id="btn18">18</div>
  <div class="number-box" id="btn19">19</div>
  <div class="number-box" id="btn20">20</div>
</div>

<!-- ✅ QUESTION -->
<div id="q3-container" style="width:100%; background-color: rgb(138, 138, 138); color: white; margin: auto; padding: 10px; border-radius: 10px; font-size: 12px;">
  <h1>3. Which of the following is an output device?</h1>
  <b>
    A. Keyboard <br>
    B. Mouse <br>
    C. Monitor <br>
    D. Scanner
  </b>
  <br><br>

  <div style="width: 60%; margin: auto;">
    <button id="q3-answer-btn"
      style="width: 100%; background-color: rgb(4, 136, 141); padding: 10px; color: white; border: none; border-radius: 5px;">
      Insert your answer
    </button>
  </div>
</div>

<br>

<div style="text-align: center;">
  <button style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold;
      border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: .3s ease; text-transform: uppercase;"
      onclick="window.location.href='q4.html'">
      Next Question →
  </button>
</div>

<script>
  // ✅ Initialize Points
  let pointsObj = JSON.parse(localStorage.getItem("quizPoints")) || { total: 0 };

  // ✅ Track answered questions
  let answeredOnce = JSON.parse(localStorage.getItem("answeredOnce")) || {};

  const answerBtn = document.getElementById("q3-answer-btn");

  // ✅ AUTO COLOR ALL ANSWERED QUESTIONS
  for (let i = 1; i <= 20; i++) {
    if (answeredOnce["q" + i]) {
      const btn = document.getElementById("btn" + i);
      if (btn) btn.classList.add("answered");
    }
  }

  // ✅ LOCK Q3 IF ALREADY ANSWERED
  if (answeredOnce["q3"]) {
    answerBtn.disabled = true;
    answerBtn.style.backgroundColor = "gray";
  }

  // ✅ ONE ATTEMPT ONLY
  answerBtn.addEventListener("click", function () {

    if (answeredOnce["q3"]) {
      alert("You already answered this question.");
      return;
    }

    const correctAnswer = "c";
    const userAnswer = prompt("Insert your answer");

    if (!userAnswer) return;

    // ✅ Lock question forever
    answeredOnce["q3"] = true;
    localStorage.setItem("answeredOnce", JSON.stringify(answeredOnce));

    // ✅ Add score ONCE
    if (userAnswer.toLowerCase() === correctAnswer) {
      pointsObj.total += 1;
      localStorage.setItem("quizPoints", JSON.stringify(pointsObj));
      window.location.href = "q4.html";
    }

    // ✅ Turn number 3 GREEN
    document.getElementById("btn3").classList.add("answered");

    // ✅ Disable button
    this.disabled = true;
    this.style.backgroundColor = "gray";
  });
</script>

</body>
</html>
