<head>
  <meta charset="UTF-8">
  <title>Q8</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 400px;
      margin: 10px auto;
    }

    .number-box {
      width: 70px;
      height: 50px;
      background: linear-gradient(135deg, #ffffff, #d3d3d3);
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .answered {
      background: green !important;
      color: white !important;
    }

    .option {
      background: white;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: black;
    }

    .option:hover {
      background: #ddd;
    }

    .correct {
      background: green !important;
      color: white !important;
    }

    .wrong {
      background: red !important;
      color: white !important;
    }

    .disabled {
      pointer-events: none;
      opacity: 0.7;
    }
  </style>
</head>

<!-- ✅ QUESTION -->
<div id="q8-container" style="width:95%; background-color: rgb(138, 138, 138); color: white; margin: auto; padding: 5px; border-radius: 10px; font-size: 12px;">
  <h1>8. What is the brain of the computer?</h1>

  <div class="options">
    <div class="option" data-answer="a">A. RAM</div>
    <div class="option" data-answer="b">B. CPU</div>
    <div class="option" data-answer="c">C. Monitor</div>
    <div class="option" data-answer="d">D. Keyboard</div>
  </div>
</div>

<br>

<div style="text-align: center;">
  <button
    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; border: none; padding: 15px 40px; font-size: 18px;
    font-weight: bold; border-radius: 50px; cursor: pointer;"
    onclick="window.location.href='../computergrade.html'">
     My Grade
  </button>
</div>

<script>
  let pointsObj = JSON.parse(localStorage.getItem("quizPoints")) || { total: 0 };
  let answeredOnce = JSON.parse(localStorage.getItem("answeredOnce")) || {};
  let userAnswers = JSON.parse(localStorage.getItem("userAnswers")) || {};

  const options = document.querySelectorAll(".option");
  const correctAnswer = "b";
  const questionKey = "q8";

  // ✅ Auto color answered grid
  for (let i = 1; i <= 20; i++) {
    if (answeredOnce["q" + i]) {
      const btn = document.getElementById("btn" + i);
      if (btn) btn.classList.add("answered");
    }
  }

  // ✅ Restore previous answer
  if (answeredOnce[questionKey]) {
    const savedUserAnswer = userAnswers[questionKey];

    options.forEach(opt => {
      const ans = opt.dataset.answer;

      if (ans === savedUserAnswer) {
        opt.classList.add(ans === correctAnswer ? "correct" : "wrong");
      }

      if (ans === correctAnswer) {
        opt.classList.add("correct");
      }

      opt.classList.add("disabled");
    });
  }

  // ✅ Click handler
  options.forEach(option => {
    option.addEventListener("click", function () {
      if (answeredOnce[questionKey]) return;

      const userAnswer = this.dataset.answer;

      answeredOnce[questionKey] = true;
      userAnswers[questionKey] = userAnswer;

      localStorage.setItem("answeredOnce", JSON.stringify(answeredOnce));
      localStorage.setItem("userAnswers", JSON.stringify(userAnswers));

      if (userAnswer === correctAnswer) {
        this.classList.add("correct");
        pointsObj.total += 1;
        localStorage.setItem("quizPoints", JSON.stringify(pointsObj));
        setTimeout(() => window.location.href = "q9.html", 800);
      } else {
        this.classList.add("wrong");
        document.querySelector(`[data-answer="${correctAnswer}"]`)
          .classList.add("correct");
      }

      document.getElementById("btn8").classList.add("answered");
      options.forEach(opt => opt.classList.add("disabled"));
           // ✅ REDIRECT TO Q2 FOR BOTH CORRECT & WRONG
      setTimeout(() => {
        window.location.href = "q9.html";
      }, 1200);
    });
  });
</script>
