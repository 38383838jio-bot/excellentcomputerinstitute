<div id="q21-container" style="width:95%; background-color: rgb(138, 138, 138); color: white; margin: auto; padding: 5px; border-radius: 10px; font-size: 12px;">
  <h1>21. What is the function to count all cells with data?</h1>

  <div class="options">
    <div class="option" data-answer="a">A. COUNTA</div>
    <div class="option" data-answer="b">B. COUNT</div>
    <div class="option" data-answer="c">C. COUNTBLANK</div>
    <div class="option" data-answer="d">D. COUNTIF</div>
  </div>
</div>

<br>

<div style="text-align: center;">
  <button
    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; border: none; padding: 15px 40px; font-size: 18px;
    font-weight: bold; border-radius: 50px; cursor: pointer;"
    onclick="window.location.href='../dashboard.html'">
     Back to Dashboard
  </button>
</div>

<script>
  let pointsObj = JSON.parse(localStorage.getItem("excelPoints")) || { total: 0 };
  let answeredOnce = JSON.parse(localStorage.getItem("excelAnsweredOnce")) || {};
  let userAnswers = JSON.parse(localStorage.getItem("excelUserAnswers")) || {};

  const options = document.querySelectorAll(".option");
  const correctAnswer = "a";   // ✅
  const questionKey = "excelq21";

  // ✅ Auto color answered grid
  for (let i = 1; i <= 50; i++) {
    if (answeredOnce["excelq" + i]) {
      const btn = document.getElementById("btn" + i);
      if (btn) btn.classList.add("answered");
    }
  }

  // ✅ Restore previous answer
  if (answeredOnce[questionKey]) {
    const savedUserAnswer = userAnswers[questionKey];

    options.forEach(opt => {
      const ans = opt.dataset.answer;

      if (ans === savedUserAnswer) {
        opt.classList.add(ans === correctAnswer ? "correct" : "wrong");
      }

      if (ans === correctAnswer) {
        opt.classList.add("correct");
      }

      opt.classList.add("disabled");
    });
  }

  // ✅ Click handler
  options.forEach(option => {
    option.addEventListener("click", function () {
      if (answeredOnce[questionKey]) return;

      const userAnswer = this.dataset.answer;

      answeredOnce[questionKey] = true;
      userAnswers[questionKey] = userAnswer;

      localStorage.setItem("excelAnsweredOnce", JSON.stringify(answeredOnce));
      localStorage.setItem("excelUserAnswers", JSON.stringify(userAnswers));

      if (userAnswer === correctAnswer) {
        this.classList.add("correct");
        pointsObj.total += 1;
        localStorage.setItem("excelPoints", JSON.stringify(pointsObj));
      } else {
        this.classList.add("wrong");
        document.querySelector(`[data-answer="${correctAnswer}"]`)
          .classList.add("correct");
      }

      document.getElementById("btn21").classList.add("answered");
      options.forEach(opt => opt.classList.add("disabled"));

      // ✅ Redirect to Q22
      setTimeout(() => {
        window.location.href = "q22.html";
      }, 1200);
    });
  });
</script>
